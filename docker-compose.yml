version: '3.8'

services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=postgres
      - DB_USER=pool_user
      - DB_PASSWORD=pool_pass
      - DB_NAME=pool_db
    depends_on:
      - postgres

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=pool_user
      - POSTGRES_PASSWORD=pool_pass
      - POSTGRES_DB=pool_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
